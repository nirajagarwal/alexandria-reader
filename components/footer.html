<!-- Running Footer (Bottom Folio) Component -->
<div class="running-footer">
    <div class="folio-left">
        <span class="folio-brand" id="footer-book-name" onclick="openLibraryModal()" style="font-weight:600; color:var(--text-muted); cursor:pointer;">
            Non-Linear Engines
        </span>
    </div>
    <div class="folio-center">
        <span class="folio-page-counter" id="footer-page-counter">Spread 1 of 1</span>
    </div>
    <div class="folio-right">
        <button class="folio-btn" id="prev-spread-btn" onclick="window.advancePage(-1)" title="Previous Spread (←)">← Prev</button>
        <button class="folio-btn" id="next-spread-btn" onclick="window.advancePage(1)" title="Next Spread (→)">Next →</button>
    </div>
</div>
