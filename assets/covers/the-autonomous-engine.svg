<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 2400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-the-autonomous-engine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e2a1e"/>
      <stop offset="60%" stop-color="#141c14"/>
      <stop offset="100%" stop-color="#141c14"/>
    </linearGradient>
    <radialGradient id="halo-the-autonomous-engine" cx="50%" cy="58%" r="45%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#141c14" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Clean Minimalist Background -->
  <rect width="1600" height="2400" fill="url(#bg-the-autonomous-engine)"/>
  <rect width="1600" height="2400" fill="url(#halo-the-autonomous-engine)"/>

  <!-- 1. Category (Clean Top Label) -->
  <g text-anchor="middle" font-family="'Inter', -apple-system, sans-serif">
    <text x="800" y="240" font-size="22" font-weight="700" letter-spacing="8" fill="#22c55e" opacity="0.95">PHYSIOLOGY & CYBERNETICS</text>
  </g>

  <!-- 2. Title & 3. Subtitle -->
  <g text-anchor="middle">
    <text x="800" y="470" font-family="'Literata', Georgia, serif" font-size="78" font-weight="700" fill="#faf9f6">
      The Autonomous Engine
    </text>
    <text x="800" y="555" font-family="'Literata', Georgia, serif" font-size="28" font-weight="300" font-style="italic" fill="#cbd5e1">
      The Control Loops of the Human Body
    </text>
  </g>

  <!-- 4. Image Emblem -->
  

  <!-- 5. Bottom Brand: ALEXANDRIA.PRESS -->
  <g text-anchor="middle" font-family="'Inter', -apple-system, sans-serif">
    <text x="800" y="2220" font-size="20" font-weight="700" letter-spacing="8" fill="#a8a29e" opacity="0.85">ALEXANDRIA.PRESS</text>
  </g>
</svg>