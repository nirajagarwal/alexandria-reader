<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 2400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-singular-minds" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1b263b"/>
      <stop offset="60%" stop-color="#0d1b2a"/>
      <stop offset="100%" stop-color="#0d1b2a"/>
    </linearGradient>
    <radialGradient id="halo-singular-minds" cx="50%" cy="58%" r="45%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0d1b2a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1600" height="2400" fill="url(#bg-singular-minds)"/>
  <rect width="1600" height="2400" fill="url(#halo-singular-minds)"/>

  <!-- Border Inset Frames -->
  <rect x="70" y="70" width="1460" height="2260" fill="none" stroke="#0ea5e9" stroke-width="1.8" opacity="0.35"/>
  <rect x="86" y="86" width="1428" height="2228" fill="none" stroke="#0ea5e9" stroke-width="0.8" opacity="0.2"/>

  <!-- Corner Brackets -->
  <g stroke="#0ea5e9" stroke-width="1.8" opacity="0.6">
    <path d="M 60 110 L 60 60 L 110 60" fill="none"/>
    <path d="M 1540 110 L 1540 60 L 1490 60" fill="none"/>
    <path d="M 60 2290 L 60 2340 L 110 2340" fill="none"/>
    <path d="M 1540 2290 L 1540 2340 L 1490 2340" fill="none"/>
  </g>

  <!-- Colophon Header -->
  <g text-anchor="middle" font-family="'Inter', -apple-system, sans-serif">
