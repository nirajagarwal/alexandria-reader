<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 2400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-architectures-of-choice" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14262c"/>
      <stop offset="60%" stop-color="#0c181c"/>
      <stop offset="100%" stop-color="#0c181c"/>
    </linearGradient>
    <radialGradient id="halo-architectures-of-choice" cx="50%" cy="58%" r="45%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0c181c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Clean Minimalist Background -->
  <rect width="1600" height="2400" fill="url(#bg-architectures-of-choice)"/>
  <rect width="1600" height="2400" fill="url(#halo-architectures-of-choice)"/>

  <!-- 1. Category (Clean Top Label) -->
  <g text-anchor="middle" font-family="'Inter', -apple-system, sans-serif">
    <text x="800" y="240" font-size="22" font-weight="700" letter-spacing="8" fill="#06b6d4" opacity="0.95">DECISION SCIENCE & STRATEGY</text>
  </g>

  <!-- 2. Title & 3. Subtitle -->
  <g text-anchor="middle">
    <text x="800" y="470" font-family="'Literata', Georgia, serif" font-size="78" font-weight="700" fill="#faf9f6">
      Architectures of Choice
    </text>
    <text x="800" y="555" font-family="'Literata', Georgia, serif" font-size="28" font-weight="300" font-style="italic" fill="#cbd5e1">
      Practical Decision Theory for an Unpredictable World
    </text>
  </g>

  <!-- 4. Image Emblem -->
  

  <!-- 5. Bottom Brand: ALEXANDRIA.PRESS -->
  <g text-anchor="middle" font-family="'Inter', -apple-system, sans-serif">
    <text x="800" y="2220" font-size="20" font-weight="700" letter-spacing="8" fill="#a8a29e" opacity="0.85">ALEXANDRIA.PRESS</text>
  </g>
</svg>