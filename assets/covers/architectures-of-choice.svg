<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 2400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-architectures-of-choice" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14262c"/>
      <stop offset="60%" stop-color="#0c181c"/>
      <stop offset="100%" stop-color="#0c181c"/>
    </linearGradient>
    <radialGradient id="halo-architectures-of-choice" cx="50%" cy="58%" r="45%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0c181c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1600" height="2400" fill="url(#bg-architectures-of-choice)"/>
  <rect width="1600" height="2400" fill="url(#halo-architectures-of-choice)"/>

  <!-- Border Inset Frames -->
  <rect x="70" y="70" width="1460" height="2260" fill="none" stroke="#06b6d4" stroke-width="1.8" opacity="0.35"/>
  <rect x="86" y="86" width="1428" height="2228" fill="none" stroke="#06b6d4" stroke-width="0.8" opacity="0.2"/>

  <!-- Corner Brackets -->
  <g stroke="#06b6d4" stroke-width="1.8" opacity="0.6">
    <path d="M 60 110 L 60 60 L 110 60" fill="none"/>
    <path d="M 1540 110 L 1540 60 L 1490 60" fill="none"/>
    <path d="M 60 2290 L 60 2340 L 110 2340" fill="none"/>
    <path d="M 1540 2290 L 1540 2340 L 1490 2340" fill="none"/>
  </g>

  <!-- Colophon Header -->
  <g text-anchor="middle" font-family="'Inter', -apple-system, sans-serif">
    <text x="800" y="210" font-size="20" font-weight="700" letter-spacing="9" fill="#06b6d4" opacity="0.95">ALEXANDRIA PRESS</text>
    <text x="800" y="252" font-size="13" font-weight="500" letter-spacing="4" fill="#a8a29e" opacity="0.75">VOLUME IX · DECISION SCIENCE & STRATEGY</text>
    <line x1="680" y1="285" x2="920" y2="285" stroke="#06b6d4" stroke-width="1" opacity="0.35"/>
  </g>

  <!-- Title & Subtitle Block -->
  <g text-anchor="middle">
    <text x="800" y="470" font-family="'Literata', Georgia, serif" font-size="76" font-weight="700" fill="#faf9f6">
      Architectures of Choice
    </text>
    <text x="800" y="555" font-family="'Literata', Georgia, serif" font-size="28" font-weight="300" font-style="italic" fill="#cbd5e1">
      Practical Decision Theory for an Unpredictable World
    </text>
  </g>

  <!-- Mathematical Emblem -->
  

  <!-- Footer Colophon -->
  <g text-anchor="middle" font-family="'Inter', -apple-system, sans-serif" opacity="0.5">
    <line x1="680" y1="2140" x2="920" y2="2140" stroke="#06b6d4" stroke-width="0.8"/>
    <text x="800" y="2185" font-size="11" font-weight="600" letter-spacing="6" fill="#a8a29e">alexandria.press</text>
  </g>
</svg>