      <stop offset="0%" stop-color="#221d18"/>
      <stop offset="60%" stop-color="#141210"/>
      <stop offset="100%" stop-color="#141210"/>
    </linearGradient>
    <radialGradient id="halo-radical-subtraction" cx="50%" cy="58%" r="48%">
