<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 2400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-affective-topologies" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#241822"/>
      <stop offset="60%" stop-color="#181016"/>
      <stop offset="100%" stop-color="#181016"/>
    </linearGradient>
    <radialGradient id="halo-affective-topologies" cx="50%" cy="58%" r="45%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#181016" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Clean Minimalist Background -->
  <rect width="1600" height="2400" fill="url(#bg-affective-topologies)"/>
  <rect width="1600" height="2400" fill="url(#halo-affective-topologies)"/>

  <!-- 1. Category (Clean Top Label) -->
  <g text-anchor="middle" font-family="'Inter', -apple-system, sans-serif">
    <text x="800" y="240" font-size="22" font-weight="700" letter-spacing="8" fill="#f43f5e" opacity="0.95">NEUROSCIENCE & CYBERNETICS</text>
  </g>

  <!-- 2. Title & 3. Subtitle -->
  <g text-anchor="middle">
    <text x="800" y="470" font-family="'Literata', Georgia, serif" font-size="78" font-weight="700" fill="#faf9f6">
      Affective Topologies
    </text>
    <text x="800" y="555" font-family="'Literata', Georgia, serif" font-size="28" font-weight="300" font-style="italic" fill="#cbd5e1">
      The Predictive Control Loops of Human Emotion
    </text>
  </g>

  <!-- 4. Image Emblem -->
  

  <!-- 5. Bottom Brand: ALEXANDRIA.PRESS -->
  <g text-anchor="middle" font-family="'Inter', -apple-system, sans-serif">
    <text x="800" y="2220" font-size="20" font-weight="700" letter-spacing="8" fill="#a8a29e" opacity="0.85">ALEXANDRIA.PRESS</text>
  </g>
</svg>